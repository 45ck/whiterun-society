name: Simulation tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: npm ci
      - run: npm test
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore tools/AgentPluginBuilder/AgentPluginBuilder.csproj --locked-mode
      - run: dotnet run --no-restore --project tools/AgentPluginBuilder/AgentPluginBuilder.csproj -- work/WhiterunAgents.esp
      - run: dotnet run --no-restore --project tools/AgentPluginBuilder/AgentPluginBuilder.csproj -- work/WhiterunRouter.esp
      - run: dotnet run --no-restore --project tools/AgentPluginBuilder/AgentPluginBuilder.csproj -- work/WhiterunRest.esp
      - run: dotnet run --no-restore --project tools/AgentPluginBuilder/AgentPluginBuilder.csproj -- work/WhiterunLanes.esp
      - run: dotnet run --no-restore --project tools/AgentPluginBuilder/AgentPluginBuilder.csproj -- work/WhiterunCitizens.esp
      - run: dotnet run --no-restore --project tools/AgentPluginBuilder/AgentPluginBuilder.csproj -- work/WhiterunActivities.esp
      - name: Read back the generated activity plugin
        env:
          WHITERUN_ACTIVITIES_STAGE: work
        run: python -m unittest discover -s tests -p test_activities_plugin.py -v
      - name: Compile original Papyrus router on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path work/caprica -Force | Out-Null
          Invoke-WebRequest 'https://github.com/Orvid/Caprica/releases/download/v0.3.0/Caprica.v0.3.0.7z' -OutFile work/caprica/compiler.7z
          if ((Get-FileHash work/caprica/compiler.7z -Algorithm SHA256).Hash -ne '0037E54CF3A1021E976278D9A637E8AE541AAF9EBEB8D274B6C2CFE32F4EE559') { throw 'Compiler archive hash mismatch' }
          tar -xf work/caprica/compiler.7z -C work/caprica
          python tools/build_router_script.py --compiler work/caprica/Caprica.exe --output work/papyrus-stage
          python tools/build_router_script.py --compiler work/caprica/Caprica.exe --output work/resident-stage --resident-control
